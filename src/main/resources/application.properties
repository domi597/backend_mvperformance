spring.application.name=${APP_NAME}
server.port=${APP_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework=INFO

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Mail (SMTP) - Zugangsdaten kommen aus der .env
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verhindert, dass Actuator st?ndig im Hintergrund eine Testverbindung zum Mailserver aufbaut
management.health.mail.enabled=false

# Nur den Health-Endpoint oeffentlich exponieren (keine Env-Variablen, Beans, Metriken etc.)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Absenderadresse f?r automatische Terminbest?tigungen
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}

# Zweite Adresse, die zusaetzlich zur Absenderadresse ueber Termine (Neubuchung, Status-
# aenderung, Stornierung, verstrichener Termin) informiert wird, z. B. ein persoenliches
# Postfach statt des allgemeinen Werkstatt-Postfachs. Leer lassen, um weiterhin nur
# app.mail.from zu verwenden.
app.mail.admin-to=${ADMIN_MAIL_TO:}

# Basis-URL des Frontends, um daraus den Passwort-Reset-Link zu bauen (z. B. https://mvperformence.at)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google-Bewertungen (Places API New) - fuer /api/reviews/summary, siehe ReviewService.
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.place-id=${GOOGLE_PLACES_ID:ChIJiyDngYKlb0cR2H9gqcexg3U}

# Fallback-Werte, solange kein API-Key hinterlegt ist (siehe ReviewService).
# Zum Aktualisieren: einfach die zwei Werte in der .env aendern und Backend neu starten - kein Rebuild noetig.
google.places.fallback-rating=${GOOGLE_PLACES_FALLBACK_RATING:4.7}
google.places.fallback-review-count=${GOOGLE_PLACES_FALLBACK_REVIEW_COUNT:42}